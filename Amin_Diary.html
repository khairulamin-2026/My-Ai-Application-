* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-canvas);
  color: var(--text-main);
  min-height: 100vh;
  margin: 0;
  padding: 0;
  font-family: Hind Siliguri, Plus Jakarta Sans, DM Sans, sans-serif;
  transition: background-color .25s, color .25s;
  overflow-x: hidden;
}

.font-display {
  font-family: Plus Jakarta Sans, Hind Siliguri, sans-serif;
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.neu-card {
  background-color: var(--bg-surface);
  box-shadow: 10px 10px 22px var(--neu-dark), -10px -10px 22px var(--neu-light);
  border: 1px solid var(--border-subtle);
  transition: transform .2s cubic-bezier(.16, 1, .3, 1), box-shadow .2s, background-color .25s;
}

.neu-card-sm {
  background-color: var(--bg-surface);
  box-shadow: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light);
  border: 1px solid var(--border-subtle);
  transition: transform .2s cubic-bezier(.16, 1, .3, 1), box-shadow .2s;
}

.neu-card-hover:hover {
  box-shadow: 12px 12px 24px var(--neu-dark), -12px -12px 24px var(--neu-light);
  transform: translateY(-2px);
}

.neu-inset {
  background-color: var(--bg-inset);
  box-shadow: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
  border: 1px solid var(--border-subtle);
  transition: box-shadow .2s, border-color .2s;
}

.neu-inset:focus-within {
  box-shadow: inset 5px 5px 10px var(--neu-dark-strong), inset -5px -5px 10px var(--neu-light);
  border-color: var(--accent);
}

.neu-btn {
  background-color: var(--bg-surface);
  color: var(--text-main);
  box-shadow: 5px 5px 11px var(--neu-dark), -5px -5px 11px var(--neu-light);
  border: 1px solid var(--border-subtle);
  transition: transform .16s cubic-bezier(.16, 1, .3, 1), box-shadow .16s, background-color .18s;
}

.neu-btn:hover {
  box-shadow: 7px 7px 14px var(--neu-dark), -7px -7px 14px var(--neu-light);
}

.neu-btn:active {
  box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light);
  transform: scale(.97);
}

.neu-btn-primary {
  background: var(--bg-surface);
  color: var(--accent);
  box-shadow: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light);
  border: 1px solid var(--border-subtle);
  font-weight: 700;
  transition: transform .16s cubic-bezier(.16, 1, .3, 1), box-shadow .16s, background-color .18s, color .18s;
}

.neu-btn-primary:hover {
  background-color: var(--accent);
  color: var(--accent-text);
  box-shadow: 6px 6px 16px var(--neu-dark), -4px -4px 12px var(--neu-light);
}

.neu-btn-primary:active {
  transform: scale(.97);
}

.neu-btn-solid {
  background-color: var(--accent);
  color: var(--accent-text);
  box-shadow: 5px 5px 12px var(--neu-dark), -4px -4px 10px var(--neu-light);
  font-weight: 700;
  transition: transform .16s cubic-bezier(.16, 1, .3, 1), background-color .18s;
}

.neu-btn-solid:hover {
  background-color: var(--accent-hover);
}

.neu-btn-solid:active {
  transform: scale(.97);
}

.neu-icon-disc {
  background-color: var(--bg-surface);
  box-shadow: 7px 7px 15px var(--neu-dark), -7px -7px 15px var(--neu-light);
  border: 1px solid var(--border-subtle);
}

.neu-circle-btn {
  background-color: var(--bg-surface);
  box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light);
  border: 1px solid var(--border-subtle);
  transition: transform .16s, box-shadow .16s;
}

.neu-circle-btn:active {
  box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light);
  transform: scale(.94);
}

.neu-nav-active {
  background-color: var(--bg-inset);
  color: var(--accent);
  box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light);
}

.neu-checkbox {
  appearance: none;
  background-color: var(--bg-inset);
  width: 18px;
  height: 18px;
  box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  border-radius: 6px;
  flex-shrink: 0;
  place-content: center;
  display: inline-grid;
}

.neu-checkbox:checked {
  background-color: var(--accent);
  box-shadow: 2px 2px 5px var(--neu-dark), -1px -1px 4px var(--neu-light);
  border-color: var(--accent);
}

.neu-checkbox:checked:after {
  content: "";
  border-bottom: 2px solid #fff;
  border-left: 2px solid #fff;
  width: 9px;
  height: 5px;
  transform: rotate(-45deg) translateY(-1px);
}

.pin-dot {
  background-color: var(--bg-inset);
  width: 13px;
  height: 13px;
  box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light);
  border-radius: 9999px;
  transition: all .18s;
}

.pin-dot.filled {
  background-color: var(--accent);
  box-shadow: 0 0 10px var(--accent-soft), 2px 2px 5px var(--neu-dark);
  transform: scale(1.16);
}

.fade-in {
  animation: .24s cubic-bezier(.16, 1, .3, 1) fadeIn;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.shake-anim {
  animation: .36s ease-in-out shake;
}

@keyframes shake {
  0%, 100% {
    transform: translateX(0);
  }

  20% {
    transform: translateX(-7px);
  }

  40% {
    transform: translateX(7px);
  }

  60% {
    transform: translateX(-5px);
  }

  80% {
    transform: translateX(5px);
  }
}

.neu-ambient-circle {
  background-color: var(--bg-surface);
  box-shadow: 16px 16px 36px var(--neu-dark), -16px -16px 36px var(--neu-light);
  opacity: .65;
  pointer-events: none;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: var(--bg-canvas);
}

::-webkit-scrollbar-thumb {
  background: var(--neu-dark);
  border-radius: 9999px;
}

@media print {
  body {
    color: #111827 !important;
    background: #fff !important;
  }

  .no-print {
    display: none !important;
  }

  .print-only {
    display: block !important;
  }

  .neu-card, .neu-card-sm, .neu-inset {
    box-shadow: none !important;
    color: #111827 !important;
    background: #fff !important;
    border: 1px solid #d1d5db !important;
  }

  * {
    color: #111827 !important;
  }
}
